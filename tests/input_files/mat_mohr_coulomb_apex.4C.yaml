TITLE:
  - "Mohr-Coulomb finite-strain return to the hydrostatic apex"
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
IO:
  OUTPUT_SPRING: true
  STRUCT_STRESS: "Cauchy"
  STRUCT_STRAIN: "GL"
  VERBOSITY: "Standard"
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  STRESS_STRAIN: true
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
STRUCTURAL DYNAMIC:
  RESTARTEVERY: 1
  DYNAMICTYPE: "Statics"
  TIMESTEP: 0.5
  NUMSTEP: 2
  MAXTIME: 1
  TOLDISP: 1e-10
  TOLRES: 1e-10
  MAXITER: 20
  LOADLIN: true
  LINEAR_SOLVER: 1
STRUCT NOX/Printing:
  Inner Iteration: false
  Outer Iteration StatusTest: false
MATERIALS:
  - MAT: 1
    MAT_PlasticMohrCoulomb:
      YOUNG_MODULUS: 2e6
      POISSON_RATIO: 0.3
      DENSITY: 2200
      COHESION: 5000
      INTERNAL_FRICTION_ANGLE: 0.5235987755982988
      INTERNAL_DILATANCY_ANGLE: 0.5235987755982988
      ISOTROPIC_HARDENING_MODULUS: 0
      EXPONENTIAL_SATURATION_COHESION: 5000
      HARDENING_EXPONENT: 0
      TOLERANCE: 1e-12
      MAX_ITERATIONS: 200
