TITLE:
  - "Load-driven Mohr-Coulomb extension-edge return with isotropic hardening"
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
IO:
  OUTPUT_SPRING: true
  STRUCT_STRESS: "Cauchy"
  STRUCT_STRAIN: "GL"
  VERBOSITY: "Standard"
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 0.1
  NUMSTEP: 10
  MAXTIME: 1
  TOLDISP: 1e-10
  TOLRES: 1e-8
  MAXITER: 30
  LINEAR_SOLVER: 1
STRUCT NOX/Printing:
  Inner Iteration: false
  Outer Iteration StatusTest: false
MATERIALS:
  - MAT: 1
    MAT_PlasticMohrCoulomb:
      YOUNG_MODULUS: 2e6
      POISSON_RATIO: 0.3
      DENSITY: 2200
      COHESION: 5000
      INTERNAL_FRICTION_ANGLE: 0.5235987755982988
      INTERNAL_DILATANCY_ANGLE: 0.436332312998582
      ISOTROPIC_HARDENING_MODULUS: 20000
      EXPONENTIAL_SATURATION_COHESION: 10000
      HARDENING_EXPONENT: 20
      TOLERANCE: 1e-12
      MAX_ITERATIONS: 200
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_TIME: "t"
RESULT DESCRIPTION:
  - STRUCTURE:
      DIS: "structure"
      NODE: 5
      QUANTITY: "dispx"
      VALUE: 0.008233799455397149
      TOLERANCE: 1e-10
DESIGN POINT NEUMANN CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 0, 0]
    VAL: [1500, 0, 0]
    FUNCT: [1, 0, 0]
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 0, 0]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 2
    NUMDOF: 3
    ONOFF: [0, 1, 0]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 3
    NUMDOF: 3
    ONOFF: [0, 0, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
DNODE-NODE TOPOLOGY:
  - "NODE 5 DNODE 1"
  - "NODE 6 DNODE 1"
  - "NODE 7 DNODE 1"
  - "NODE 8 DNODE 1"
DSURF-NODE TOPOLOGY:
  - "NODE 1 DSURFACE 1"
  - "NODE 2 DSURFACE 1"
  - "NODE 3 DSURFACE 1"
  - "NODE 4 DSURFACE 1"
  - "NODE 1 DSURFACE 2"
  - "NODE 3 DSURFACE 2"
  - "NODE 5 DSURFACE 2"
  - "NODE 7 DSURFACE 2"
  - "NODE 1 DSURFACE 3"
  - "NODE 2 DSURFACE 3"
  - "NODE 5 DSURFACE 3"
  - "NODE 6 DSURFACE 3"
NODE COORDS:
  - "NODE 1 COORD 0 0 0"
  - "NODE 2 COORD 0 1 0"
  - "NODE 3 COORD 0 0 1"
  - "NODE 4 COORD 0 1 1"
  - "NODE 5 COORD 1 0 0"
  - "NODE 6 COORD 1 1 0"
  - "NODE 7 COORD 1 0 1"
  - "NODE 8 COORD 1 1 1"
STRUCTURE ELEMENTS:
  - "1 SOLID HEX8 1 5 6 2 3 7 8 4 MAT 1 KINEM nonlinear"
